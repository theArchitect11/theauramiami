<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#13151c"/>
  <!-- Gold border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#d4af5f" stroke-width="0.75" stroke-opacity="0.85"/>
  <!-- Diamond mark (rotated square) -->
  <rect x="11" y="11" width="10" height="10" fill="none" stroke="#d4af5f" stroke-width="1.1" transform="rotate(45 16 16)"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.2" fill="#d4af5f" fill-opacity="0.9"/>
</svg>
